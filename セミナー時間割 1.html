<style>
:root{

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F141B;--surface:#19212C;--ink:#EAEFF5;--sub:#9AA6B5;--line:#2A3442;
    --warn:#FDA172;--warn-bg:#3A2418;
    --r0:#6C9BFF;--r1:#4CC795;--r2:#FF8A66;--r3:#B58CFF;--r4:#E8B04A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F141B;--surface:#19212C;--ink:#EAEFF5;--sub:#9AA6B5;--line:#2A3442;
  --warn:#FDA172;--warn-bg:#3A2418;
  --r0:#6C9BFF;--r1:#4CC795;--r2:#FF8A66;--r3:#B58CFF;--r4:#E8B04A;

}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;line-height:1.6;padding-bottom:84px}
main{max-width:640px;margin:0 auto;padding:20px 16px}
h1{font-size:26px;font-weight:900;margin:0 0 4px;letter-spacing:.02em}
.sub{color:var(--sub);font-size:14px;margin:0 0 16px}
.days{display:flex;gap:8px;margin-bottom:18px}
.day{flex:1;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 6px;font:inherit;cursor:pointer;text-align:center}
.day b{display:block;font-size:20px;font-weight:900;line-height:1.2}
.day span{font-size:12px;color:var(--sub)}
.day[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.day[aria-pressed="true"] span{color:var(--bg);opacity:.75}
.slot{margin-bottom:20px}
.slot h2{font-size:15px;font-weight:700;margin:0 0 8px;color:var(--sub)}
.card{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:8px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--rc)}
.card .body{flex:1;min-width:0;padding-left:4px}
.card h3{font-size:16px;font-weight:700;margin:0 0 4px;line-height:1.45}
.meta{font-size:13px;color:var(--sub)}
.room{display:inline-block;font-size:12px;font-weight:700;color:var(--rc);margin-right:8px}
.onl{display:inline-block;font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--sub)}
.fav{align-self:flex-start;flex:none;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.fav[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fav:focus-visible,.day:focus-visible,.tab:focus-visible{outline:3px solid var(--r0);outline-offset:2px}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:18px;font-size:15px}
.summary b{font-size:22px;font-weight:900}
.warn{color:var(--warn);font-weight:700;margin-top:6px;font-size:14px}
.tl{position:relative;padding-left:0}
.row{display:flex;gap:8px;margin-bottom:0}
.time{width:46px;flex:none;text-align:right;font-size:14px;font-weight:700;padding-top:14px;font-variant-numeric:tabular-nums}
.time small{display:block;font-size:12px;font-weight:400;color:var(--sub)}
.rail{width:14px;flex:none;position:relative}
.rail::before{content:"";position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--line)}
.rail i{position:absolute;left:0;top:19px;width:14px;height:14px;border-radius:50%;background:var(--rc,var(--sub));border:3px solid var(--bg)}
.rail.brk i{background:var(--line)}
.row .card,.row .brk-card{flex:1;min-width:0;margin-bottom:12px}
.brk-card{padding:14px 4px;color:var(--sub);font-size:14px}
.row .card{flex-direction:column;gap:8px}
.row .card .fav{align-self:flex-start}
.par{display:flex;gap:8px;flex:1;min-width:0;margin-bottom:12px;overflow-x:auto}
.par .card{flex:1 0 126px;min-width:126px;margin-bottom:0;padding:12px 12px 12px 14px}
.par .card h3{font-size:14px}
.par .card .fav{align-self:stretch;text-align:center;white-space:normal;font-size:12px;padding:6px 8px}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:14px;padding:28px 18px;text-align:center;color:var(--sub)}
.empty button{margin-top:12px;border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;border-radius:999px;padding:10px 20px;cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));gap:8px;z-index:5}
.tab{flex:1;border:0;background:transparent;color:var(--sub);font:inherit;font-size:15px;font-weight:700;padding:10px;border-radius:12px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.badge{display:inline-block;min-width:22px;background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:12px;padding:0 6px;margin-left:6px}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>
</head>

 {day:1,start:"12:30",end:"13:30",title:"昼休憩"},
 {day:1,start:"14:50",end:"15:10",title:"休憩"},
 {day:1,start:"16:30",end:"16:50",title:"休憩"},
 {day:2,start:"10:50",end:"11:10",title:"休憩"},
 {day:2,start:"12:30",end:"13:30",title:"昼休憩"},
 {day:2,start:"14:50",end:"15:10",title:"休憩"},
 {day:2,start:"16:30",end:"16:50",title:"休憩"}
];
var day=0,view="all",fav=new Set(load());
function load(){try{return JSON.parse(localStorage.getItem("seminar-fav-1121")||"[]")}catch(e){return[]}}
function save(){try{localStorage.setItem("seminar-fav-1121",JSON.stringify(Array.from(fav)))}catch(e){}}
function mins(t){var p=t.split(":");return +p[0]*60+ +p[1]}
function overlap(a,b){return mins(a.start)<mins(b.end)&&mins(b.start)<mins(a.end)}
function favBtn(s){var on=fav.has(s.id);return '<button class="fav" data-id="'+s.id+'" aria-pressed="'+on+'">'+(on?'★ お気に入り済み':'☆ お気に入りに追加')+'</button>'}
function card(s,extra){
  return '<div class="card" style="--rc:'+ROOMS[s.room]+'"><div class="body"><h3>'+s.title+'</h3><div class="meta"><span class="room">'+s.room+'</span>'+(s.online?'<span class="onl">オンライン中継あり</span>':'')+(extra&&extra.time?'<br>'+s.start+' – '+s.end:'')+s.who.map(function(w){return '<br>'+w}).join("")+'</div></div>'+favBtn(s)+'</div>';
}
function renderDays(){
  document.getElementById("days").innerHTML=DAYS.map(function(d,i){
    var n=S.filter(function(s){return s.day===i&&fav.has(s.id)}).length;
    return '<button class="day" data-day="'+i+'" aria-pressed="'+(i===day)+'"><b>'+d.s+'</b><span>'+d.w+'曜日'+(n?' ・ '+n+'講座':'')+'</span></button>';
  }).join("");
}
function renderAll(){
  var list=S.filter(function(s){return s.day===day});
  var slots={};list.forEach(function(s){var k=s.start+"–"+s.end;(slots[k]=slots[k]||[]).push(s)});
  return Object.keys(slots).sort().map(function(k){
    return '<section class="slot"><h2>'+k.replace("–"," – ")+'</h2>'+slots[k].map(function(s){return card(s)}).join("")+'</section>';
  }).join("");
}
function renderMy(){
  var mine=S.filter(function(s){return s.day===day&&fav.has(s.id)});
  if(!mine.length){
    return '<div class="empty">この日のお気に入りはまだありません。<br>講座一覧で「☆ お気に入りに追加」を押すと、ここに時間割が表示されます。<br><button data-go="all">講座一覧を見る</button></div>';
  }
  var sorted=mine.slice().sort(function(a,b){return mins(a.start)-mins(b.start)});
  var groups=[];
  sorted.forEach(function(s){var g=groups[groups.length-1];if(g&&mins(s.start)<mins(g.end)){g.g.push(s);if(mins(s.end)>mins(g.end))g.end=s.end}else groups.push({t:"g",g:[s],start:s.start,end:s.end})});
  var total=groups.reduce(function(a,g){return a+mins(g.end)-mins(g.start)},0);
  var h=Math.floor(total/60),m=total%60;
  var out='<div class="summary"><b>'+mine.length+'</b> 講座 ・ 合計 '+(h?h+'時間':'')+(m?m+'分':'')+'</div>';
  var items=groups.concat(BR.filter(function(b){return b.day===day&&mins(b.start)>=mins(groups[0].end)&&mins(b.end)<=mins(groups[groups.length-1].start)}).map(function(b){return {t:"b",b:b}}));
  items.sort(function(a,b){return mins((a.b||a).start)-mins((b.b||b).start)});
  out+='<div class="tl">'+items.map(function(it){
    if(it.t==="b"){var b=it.b;return '<div class="row"><div class="time">'+b.start+'<small>'+b.end+'</small></div><div class="rail brk"><i></i></div><div class="brk-card">'+b.title+'</div></div>'}
    var g=it.g,s=g[0];var body=g.length>1?'<div class="par">'+g.map(function(x){return card(x,{time:true})}).join("")+'</div>':card(s);
    return '<div class="row"><div class="time">'+it.start+'<small>'+it.end+'</small></div><div class="rail" style="--rc:'+ROOMS[s.room]+'"><i></i></div>'+body+'</div>';
  }).join("")+'</div>';
  return out;
}
function render(){
  var d=DAYS[day];
  document.getElementById("sub").textContent=d.d+"("+d.w+")"+(view==="all"?"の講座一覧":"のマイ時間割");
  renderDays();
  document.getElementById("view").innerHTML=view==="all"?renderAll():renderMy();
  document.getElementById("cnt").textContent=fav.size;
  document.getElementById("tab-all").setAttribute("aria-pressed",view==="all");
  document.getElementById("tab-my").setAttribute("aria-pressed",view==="my");
}
document.addEventListener("click",function(e){
  var f=e.target.closest("[data-id]");
  if(f){var id=+f.dataset.id;fav.has(id)?fav.delete(id):fav.add(id);save();render();var nb=document.querySelector('.fav[data-id="'+id+'"]');if(nb)nb.focus({preventScroll:true});return}
  var d=e.target.closest("[data-day]");
  if(d){day=+d.dataset.day;render();window.scrollTo(0,0);return}
  var g=e.target.closest("[data-go]");
  if(g){view=g.dataset.go;render();window.scrollTo(0,0);return}
});
document.getElementById("tab-all").onclick=function(){view="all";render();window.scrollTo(0,0)};
document.getElementById("tab-my").onclick=function(){view="my";render();window.scrollTo(0,0)};
render();
</script>
</body>
</html>
